<svg xmlns="http://www.w3.org/2000/svg" width="1184" height="800" viewBox="0 0 1184 800" role="img" aria-labelledby="title desc">
<title id="title">The authoring pipeline</title>
<desc id="desc">The lead plans five moments and briefs the writer. Every write passes the validator hook, then the rubric reviewer, then the quality gate, then the AppSec engineer and the AppSec gate, then the publisher opens the release PR. Schema errors, a reviewer fix list and an AppSec block all loop back to the writer.</desc>
