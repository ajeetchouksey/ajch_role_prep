<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="472" viewBox="0 0 1200 472" role="img" aria-labelledby="title desc">
<title id="title">Roadmap: three phases, two gates</title>
<desc id="desc">Phase 1 builds the free core, then Gate 1 asks whether AI scoring matches human scoring (80% agreement on 20 blind answers). Phase 2 is a free launch that measures usage, then Gate 2 asks whether repeat usage is proven (30% return within 7 days, 200 weekly practisers). Phase 3 adds Interview Pass and Teams. A failed gate loops back to its phase.</desc>
