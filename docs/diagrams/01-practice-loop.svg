<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="400" viewBox="0 0 1152 400" role="img" aria-labelledby="title desc">
<title id="title">The practice loop</title>
<desc id="desc">Four steps: answer out loud, see which rubric points were hit, read your answer rewritten with one fix, then a readiness check that loops back to answering until the moment is marked ready.</desc>
