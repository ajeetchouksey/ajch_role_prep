<defs><filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#14122B" flood-opacity="0.07"/></filter><marker id="ah-step" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" class="ah k-step"/></marker><marker id="ah-good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" class="ah k-good"/></marker><marker id="ah-risk" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" class="ah k-risk"/></marker><marker id="ah-stop" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" class="ah k-stop"/></marker><marker id="ah-live" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" class="ah k-live"/></marker><marker id="ah-plain" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" class="ah k-plain"/></marker></defs>
<rect x="0.75" y="0.75" width="1150.5" height="398.5" rx="18" class="cv" stroke-width="1.5"/>
<text x="32" y="46" class="t1" font-size="20" font-weight="700" text-anchor="start">The practice loop</text>
<text x="32" y="68" class="t2" font-size="13" font-weight="400" text-anchor="start">One interview moment, practised until it is ready at your level</text>
<g transform="translate(32,88)">
<path d="M176,76 L240,76" class="e k-plain" marker-end="url(#ah-plain)"/>
<path d="M424,76 L488,76" class="e k-plain" marker-end="url(#ah-plain)"/>
<path d="M672,76 L736,76" class="e k-plain" marker-end="url(#ah-plain)"/>
<path d="M896,76 L944,76" class="e k-good" marker-end="url(#ah-good)"/>
<path d="M816,128 L816,190 Q816,200 806,200 L98,200 Q88,200 88,190 L88,128" class="e k-risk dash" marker-end="url(#ah-risk)"/>
<g class="k-step"><rect x="0" y="24" width="176" height="104" rx="12" class="nb" filter="url(#sh)"/><rect x="8" y="36" width="4" height="80" rx="2" class="ac"/><text x="22" y="57" class="ey" font-size="10.5" font-weight="700" text-anchor="start" letter-spacing="0.08em">STEP 1</text><text x="22" y="79" class="t1" font-size="15" font-weight="600" text-anchor="start">Answer out loud</text><text x="22" y="102" class="t2" font-size="12.5" font-weight="400" text-anchor="start">Timed, spoken or typed</text></g>
<g class="k-live"><rect x="240" y="24" width="184" height="104" rx="12" class="nb" filter="url(#sh)"/><rect x="248" y="36" width="4" height="80" rx="2" class="ac"/><text x="262" y="57" class="ey" font-size="10.5" font-weight="700" text-anchor="start" letter-spacing="0.08em">STEP 2</text><text x="262" y="79" class="t1" font-size="15" font-weight="600" text-anchor="start">See rubric points hit</text><text x="262" y="102" class="t2" font-size="12.5" font-weight="400" text-anchor="start">Covered, partly or missed</text></g>
<g class="k-step"><rect x="488" y="24" width="184" height="104" rx="12" class="nb" filter="url(#sh)"/><rect x="496" y="36" width="4" height="80" rx="2" class="ac"/><text x="510" y="47.3" class="ey" font-size="10.5" font-weight="700" text-anchor="start" letter-spacing="0.08em">STEP 3</text><text x="510" y="69.3" class="t1" font-size="15" font-weight="600" text-anchor="start">Read your answer</text><text x="510" y="88.8" class="t1" font-size="15" font-weight="600" text-anchor="start">rewritten</text><text x="510" y="111.8" class="t2" font-size="12.5" font-weight="400" text-anchor="start">One fix to take first</text></g>
<g class="k-good"><rect x="944" y="24" width="144" height="104" rx="12" class="nb" filter="url(#sh)"/><rect x="952" y="36" width="4" height="80" rx="2" class="ac"/><text x="966" y="48.8" class="ey" font-size="10.5" font-weight="700" text-anchor="start" letter-spacing="0.08em">OUTCOME</text><text x="966" y="70.8" class="t1" font-size="15" font-weight="600" text-anchor="start">Marked ready</text><text x="966" y="93.8" class="t2" font-size="12.5" font-weight="400" text-anchor="start">Counts toward</text><text x="966" y="110.3" class="t2" font-size="12.5" font-weight="400" text-anchor="start">level readiness</text></g>
<g class="k-risk"><polygon points="816,24 896,76 816,128 736,76" class="nb" stroke-linejoin="round" filter="url(#sh)"/><text x="816" y="72" class="t1" font-size="13.5" font-weight="600" text-anchor="middle">Moment</text><text x="816" y="89.6" class="t1" font-size="13.5" font-weight="600" text-anchor="middle">ready?</text></g>
<g class="k-plain"><rect x="181.3" y="45" width="53.4" height="22" rx="11" class="lp"/><text x="208" y="60" class="lt" font-size="11.5" font-weight="500" text-anchor="middle">submit</text></g>
<g class="k-plain"><rect x="416.8" y="45" width="78.5" height="22" rx="11" class="lp"/><text x="456" y="60" class="lt" font-size="11.5" font-weight="500" text-anchor="middle">take one fix</text></g>
<g class="k-plain"><rect x="672.5" y="45" width="63.1" height="22" rx="11" class="lp"/><text x="704" y="60" class="lt" font-size="11.5" font-weight="500" text-anchor="middle">try again</text></g>
<g class="k-good"><rect x="901.9" y="45" width="36.3" height="22" rx="11" class="lp"/><text x="920" y="60" class="lt" font-size="11.5" font-weight="500" text-anchor="middle">yes</text></g>
<g class="k-risk"><rect x="377.1" y="189" width="149.8" height="22" rx="11" class="lp"/><text x="452" y="204" class="lt" font-size="11.5" font-weight="500" text-anchor="middle">not yet: retry the moment</text></g>
</g>
<line x1="32" y1="332" x2="1120" y2="332" class="rule"/><g class="k-step"><rect x="32" y="346" width="14" height="14" rx="4" class="nb"/><text x="54" y="357.5" class="t2" font-size="12" font-weight="400" text-anchor="start">Candidate action</text></g><g class="k-live"><rect x="171.76000000000002" y="346" width="14" height="14" rx="4" class="nb"/><text x="193.8" y="357.5" class="t2" font-size="12" font-weight="400" text-anchor="start">AI feedback</text></g><g class="k-risk"><rect x="284.88000000000005" y="346" width="14" height="14" rx="4" class="nb"/><text x="306.9" y="357.5" class="t2" font-size="12" font-weight="400" text-anchor="start">Readiness check</text></g><g class="k-good"><rect x="425.4800000000001" y="346" width="14" height="14" rx="4" class="nb"/><text x="447.5" y="357.5" class="t2" font-size="12" font-weight="400" text-anchor="start">Outcome</text></g>
</svg>
