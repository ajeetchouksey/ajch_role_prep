<g class="k-step"><rect x="408" y="464" width="272" height="96" rx="12" class="nb" filter="url(#sh)"/><rect x="416" y="476" width="4" height="72" rx="2" class="ac"/><text x="430" y="506" class="t1" font-size="15" font-weight="600" text-anchor="start">Local first</text><text x="430" y="529" class="t2" font-size="12.5" font-weight="400" text-anchor="start">Written to IndexedDB on the device</text></g>
<g class="k-good"><rect x="816" y="464" width="272" height="96" rx="12" class="nb" filter="url(#sh)"/><rect x="824" y="476" width="4" height="72" rx="2" class="ac"/><text x="838" y="506" class="t1" font-size="15" font-weight="600" text-anchor="start">Saved offline</text><text x="838" y="529" class="t2" font-size="12.5" font-weight="400" text-anchor="start">Synced when you sign in</text></g>
<g class="k-plain"><rect x="0" y="600" width="272" height="96" rx="12" class="nb" filter="url(#sh)"/><rect x="8" y="612" width="4" height="72" rx="2" class="ac"/><text x="22" y="642" class="t1" font-size="15" font-weight="600" text-anchor="start">API calls</text><text x="22" y="665" class="t2" font-size="12.5" font-weight="400" text-anchor="start">/api/transcribe, /api/feedback</text></g>
