<g class="k-step"><rect x="408" y="56" width="272" height="96" rx="12" class="nb" filter="url(#sh)"/><rect x="416" y="68" width="4" height="72" rx="2" class="ac"/><text x="430" y="98" class="t1" font-size="15" font-weight="600" text-anchor="start">Network first</text><text x="430" y="121" class="t2" font-size="12.5" font-weight="400" text-anchor="start">Cached copy if the network fails</text></g>
<g class="k-risk"><rect x="816" y="56" width="272" height="96" rx="12" class="nb" filter="url(#sh)"/><rect x="824" y="68" width="4" height="72" rx="2" class="ac"/><text x="838" y="89.8" class="t1" font-size="15" font-weight="600" text-anchor="start">Pages you opened before</text><text x="838" y="112.8" class="t2" font-size="12.5" font-weight="400" text-anchor="start">Open from cache; new pages need a</text><text x="838" y="129.3" class="t2" font-size="12.5" font-weight="400" text-anchor="start">connection</text></g>
<g class="k-plain"><rect x="0" y="192" width="272" height="96" rx="12" class="nb" filter="url(#sh)"/><rect x="8" y="204" width="4" height="72" rx="2" class="ac"/><text x="22" y="234" class="t1" font-size="15" font-weight="600" text-anchor="start">App files</text><text x="22" y="257" class="t2" font-size="12.5" font-weight="400" text-anchor="start">JavaScript and CSS of the shell</text></g>
<g class="k-step"><rect x="408" y="192" width="272" height="96" rx="12" class="nb" filter="url(#sh)"/><rect x="416" y="204" width="4" height="72" rx="2" class="ac"/><text x="430" y="234" class="t1" font-size="15" font-weight="600" text-anchor="start">Precache</text><text x="430" y="257" class="t2" font-size="12.5" font-weight="400" text-anchor="start">Stored at install, versioned</text></g>
<g class="k-good"><rect x="816" y="192" width="272" height="96" rx="12" class="nb" filter="url(#sh)"/><rect x="824" y="204" width="4" height="72" rx="2" class="ac"/><text x="838" y="234" class="t1" font-size="15" font-weight="600" text-anchor="start">The app always opens</text><text x="838" y="257" class="t2" font-size="12.5" font-weight="400" text-anchor="start">The shell never needs the network</text></g>
<g class="k-plain"><rect x="0" y="328" width="272" height="96" rx="12" class="nb" filter="url(#sh)"/><rect x="8" y="340" width="4" height="72" rx="2" class="ac"/><text x="22" y="370" class="t1" font-size="15" font-weight="600" text-anchor="start">Content JSON</text><text x="22" y="393" class="t2" font-size="12.5" font-weight="400" text-anchor="start">/content/roleprep/**</text></g>
