<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="896" viewBox="0 0 1152 896" role="img" aria-labelledby="title desc">
<title id="title">Offline strategy</title>
<desc id="desc">Five request types and the strategy for each. Page navigations are network first with a cached fallback. App files are precached. Content JSON is stale while revalidate. Progress is written locally first to IndexedDB. API calls are network only, so transcription and AI feedback need a connection.</desc>
