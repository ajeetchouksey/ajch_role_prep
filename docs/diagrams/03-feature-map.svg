<svg xmlns="http://www.w3.org/2000/svg" width="1184" height="1256" viewBox="0 0 1184 1256" role="img" aria-labelledby="title desc">
<title id="title">Feature map</title>
<desc id="desc">Phase 1 builds F1 to F6: content model, practice room, speak your answer, AI feedback, journey setup and own-AI access. Gate 1 needs 80% scoring agreement. Phase 2 adds F7 accounts and F8 growth and measurement. Gate 2 needs 30% return within 7 days and 200 weekly active practisers. Phase 3 holds F9 Interview Pass and F10 Teams.</desc>
