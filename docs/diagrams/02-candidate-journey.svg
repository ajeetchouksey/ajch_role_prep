<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
<title id="title">The candidate journey</title>
<desc id="desc">Set level and date, pick the topics the role needs, then practise one sub-topic a day. At the readiness check, a no sends the candidate back to daily practice, either with the next sub-topic or through a SkillUp or HOL Lab detour to close a gap. A yes leads to a mixed mock round, the night-before review and interview day.</desc>
