<svg xmlns="http://www.w3.org/2000/svg" width="1168" height="1000" viewBox="0 0 1168 1000" role="img" aria-labelledby="title desc">
<title id="title">App architecture</title>
<desc id="desc">The browser, either a public page visitor or the installed PWA, talks to one Cloudflare Worker at roleprep.aaryaai.dev. The Worker serves static assets (pre-rendered public pages and the app shell) and its own API, which calls Workers AI. The installed app calls api.aaryaai.dev directly for sign-in and sync. At build time, content/roleprep is read by the React Router pre-render, which writes build/client for the Worker. The old aaryaai.dev/roleprep address redirects to the public pages.</desc>
