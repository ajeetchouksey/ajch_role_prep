<svg xmlns="http://www.w3.org/2000/svg" width="1168" height="1000" viewBox="0 0 1168 1000" role="img" aria-labelledby="title desc">
<title id="title">Target architecture</title>
<desc id="desc">Role Prep content and the agent kit live in ajch_role_prep. The promote workflow records a pinned commit in content-manifest.json, jsDelivr serves that commit, and the ajch_platform web app and MCP server read it. Brand tokens reach the web app from the AaryaAI brand package; the Worker routes call speech and AI services.</desc>
