<svg xmlns="http://www.w3.org/2000/svg" width="1168" height="928" viewBox="0 0 1168 928" role="img" aria-labelledby="title desc">
<title id="title">Target architecture</title>
<desc id="desc">Role Prep content, the app and the agent kit live in ajch_role_prep. A build pre-renders the app and writes it for the roleprep Worker at roleprep.aaryaai.dev, which serves the static assets and its own API and MCP server; the API calls Workers AI. Brand tokens reach the app from the AaryaAI brand package, and ajch_agent_framework renders the kit.</desc>
